# Tracks merged PR titles on main to maintain a release PR with version bumps and CHANGELOG.md.
# Merging the release PR tags vX.Y.Z and creates a GitHub release without building a new image.
name: release

on:
  push:
    branches: [main]
  # Every merge can count, so no path filter. No manual or scheduled runs.

# GITHUB_TOKEN isn't used: the App token below does all the writing.
permissions: {}

# One run at a time, so two runs never update the release PR or create a release together.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-26.04
    steps:
      # App token triggers workflows on release PRs (GITHUB_TOKEN blocks CI check runs).
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write           # release PR branch, tag, and GitHub release
          permission-pull-requests: write      # release PR management
          permission-issues: write             # autorelease labels

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
